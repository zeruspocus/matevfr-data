# Every few hours, builds the Argentina NOTAM areas from the ANAC AIS list (five FIR) and publishes them as the
# `ar-notams.geojson` asset of the `notam-data-v1` release, which the apps download.
name: anac-notams
on:
  schedule:
    - cron: "15 */3 * * *"   # the ANAC list is updated continuously; the apps look every 6 hours
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the tests
        run: cd Tools/notams && python3 -m unittest test_anac_notams test_gcaa_notams
      - name: Build the areas file from the ANAC lists
        run: cd Tools/notams && python3 anac_notams.py --fetch --out ../../ar-notams.geojson
      - name: Stop if the lists looked empty (never publish over a good file with a broken read)
        run: python3 -c "import json,sys; d=json.load(open('ar-notams.geojson')); sys.exit(0 if d['notamCount']>=5 else 1)"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view notam-data-v1 >/dev/null 2>&1 || gh release create notam-data-v1 --title "NOTAM areas" --notes "Daily NOTAM areas. Informational only."
          gh release upload notam-data-v1 ar-notams.geojson --clobber
